name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
          pip install nose
          python -c "import site, os; open(os.path.join(site.getsitepackages()[0], 'sitecustomize.py'), 'w').write('import collections, collections.abc\nif not hasattr(collections, \"Callable\"): collections.Callable = collections.abc.Callable\n')"

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Run unit tests with nose
        run: |
          nosetests -v

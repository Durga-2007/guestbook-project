apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Starting cleanup task"
        rm -rf .pytest_cache || true
        rm -rf pycache || true
        echo "Cleanup completed successfully"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing dependencies"
        pip install --upgrade pip
        pip install flask
        pip install flake8
        pip install nose

        echo "Running Flake8"
        flake8 .

        echo "Running unit tests with Nose"
        nosetests -v

        echo "Test task completed successfully"
